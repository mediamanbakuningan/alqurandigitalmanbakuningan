  <style>
  :root {
      --q-bg-body: #f4f7f5;
      --q-bg-card: #ffffff;
      --q-glass-bg: rgba(255, 255, 255, 0.98);
      --q-primary: #08502F;
      --q-primary-dark: #04331e;
      --q-gold: #b8860b;
      --q-gold-light: #fef0c7;
      --q-border: #e2e8f0;
      --q-shadow: rgba(0, 0, 0, 0.08);
      --q-text-arabic: #000000;
      --q-text-main: #1e293b;
      --q-text-latin: #08502F;
      --q-text-muted: #475569;
      --q-arabic-size: 3.5rem;
  }
  [data-bs-theme="dark"] {
      --q-bg-body: #090e0c;
      --q-bg-card: #131b17;
      --q-glass-bg: rgba(19, 27, 23, 0.98);
      --q-primary: #10b981;
      --q-primary-dark: #059669;
      --q-gold: #fbbf24;
      --q-gold-light: #78350f;
      --q-border: #1e293b;
      --q-shadow: rgba(0, 0, 0, 0.5);
      --q-text-arabic: #ffffff;
      --q-text-main: #f8fafc;
      --q-text-latin: #34d399;
      --q-text-muted: #cbd5e1;
  }
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--q-bg-body) !important; color: var(--q-text-main); transition: background-color 0.3s ease, color 0.3s ease; display: flex; flex-direction: column; min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  .font-arabic { font-family: 'Amiri Quran', serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--q-bg-body); }
  ::-webkit-scrollbar-thumb { background: var(--q-gold); border-radius: 10px; }
  .navbar-glass { background: var(--q-glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 2px solid var(--q-border); height: 75px; box-shadow: 0 4px 20px var(--q-shadow); top: env(safe-area-inset-top, 0px); }
  .navbar-brand { color: var(--q-primary) !important; letter-spacing: 1.5px; font-weight: 800 !important; }
  @media (max-width: 767px) { .brand-wrapper { position: absolute; left: 50%; transform: translateX(-50%); width: auto; text-align: center; } }
  #dashboard-section, #ayah-section { flex-grow: 1; }
  .prayer-section { padding: 90px 0 10px 0; }
  .prayer-card { text-align: center; padding: 15px 10px; border-radius: 1.2rem; border: 1px solid var(--q-border); background: var(--q-bg-card); transition: 0.3s; box-shadow: 0 4px 10px var(--q-shadow); height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .prayer-card.active-prayer { background: var(--q-primary); border-color: var(--q-primary); color: white !important; transform: translateY(-4px); box-shadow: 0 12px 25px rgba(8, 80, 47, 0.3); }
  .prayer-name { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--q-text-muted); display: block; margin-bottom: 5px; }
  .prayer-time { font-size: 1.4rem; font-weight: 800; color: var(--q-text-main); }
  .prayer-card.active-prayer .prayer-name, .prayer-card.active-prayer .prayer-time { color: white; }
  #last-read-banner { background: var(--q-glass-bg); border: 2px solid var(--q-gold) !important; border-radius: 1.2rem; display: none; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(184, 134, 11, 0.15); }
  #last-read-banner:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(184, 134, 11, 0.25); }
  .hero-section { background: linear-gradient(145deg, var(--q-primary-dark), var(--q-primary)); padding: 50px 20px; position: relative; overflow: hidden; border-radius: 0 0 2.5rem 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
  @media (max-width: 360px) { .hero-section { padding: 40px 15px; } }
  .hero-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 0l30 30-30 30L0 30z" fill="rgba(255,255,255,0.05)"/></svg>'); background-size: 80px; pointer-events: none; }
  .search-input-wrapper { max-width: 750px; margin: 0 auto; position: relative; z-index: 2; }
  .search-input-wrapper input { width: 100%; padding: 20px 30px; border-radius: 50px; border: 3px solid rgba(255,255,255,0.2); font-size: 1.1rem; box-shadow: 0 20px 40px rgba(0,0,0,0.2); outline: none; background: #ffffff; color: #000000; font-weight: 600; transition: 0.3s; }
  .search-input-wrapper input:focus { border-color: var(--q-gold); box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.2); }
  .quick-links-scroll { display: flex; gap: 12px; overflow-x: auto; padding-top: 30px; padding-bottom: 15px; margin: 0 auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; position: relative; z-index: 2; justify-content: flex-start; }
  .quick-links-scroll::-webkit-scrollbar { display: none; }
  .quick-chip { background: rgba(0, 0, 0, 0.2); color: #ffffff; border: 2px solid rgba(255,255,255,0.3); padding: 10px 25px; border-radius: 50px; font-weight: 700; font-size: 0.95rem; white-space: nowrap; cursor: pointer; transition: 0.3s; backdrop-filter: blur(8px); }
  .quick-chip:hover { background: var(--q-gold); color: #fff; transform: translateY(-3px); border-color: var(--q-gold); box-shadow: 0 8px 20px rgba(184, 134, 11, 0.4); }
  .grid-section { padding: 40px 0 60px 0; }
  .surah-card { display: flex; align-items: center; padding: 25px; border-radius: 1.2rem; border: 2px solid var(--q-border); background: var(--q-bg-card); cursor: pointer; transition: all 0.3s ease; height: 100%; position: relative; overflow: hidden; box-shadow: 0 5px 15px var(--q-shadow); }
  .surah-card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--q-gold); transform: scaleY(0); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .surah-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px var(--q-shadow); border-color: var(--q-border); }
  .surah-card:hover::after { transform: scaleY(1); }
  .surah-num-ring { width: 55px; height: 55px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--q-text-main); font-size: 1rem; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 L85 15 L100 50 L85 85 L50 100 L15 85 L0 50 L15 15 Z" fill="none" stroke="%23b8860b" stroke-width="5"/><circle cx="50" cy="50" r="35" fill="none" stroke="%23b8860b" stroke-width="3" opacity="0.6"/></svg>') center/contain no-repeat; }
  .surah-arabic-name { font-size: 2rem; color: var(--q-text-arabic); font-weight: 700; }
  .skeleton-card { background: var(--q-bg-card); border-radius: 1.2rem; padding: 25px; border: 2px solid var(--q-border); display: flex; align-items: center; }
  .skeleton-ring { width: 55px; height: 55px; border-radius: 50%; background: var(--q-border); animation: pulse 1.5s infinite; flex-shrink: 0; }
  .skeleton-text { flex-grow: 1; margin-left: 20px; }
  .skeleton-line { height: 14px; background: var(--q-border); border-radius: 4px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  #ayah-section { display: none; padding: 100px 0 100px 0; }
  .bismillah { font-size: 3.5rem; text-align: center; margin: 0 0 50px; color: var(--q-text-arabic); font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .ayah-card { padding: 40px; margin-bottom: 30px; border-radius: 1.5rem; border: 2px solid var(--q-border); background: var(--q-bg-card); transition: 0.3s; box-shadow: 0 5px 20px var(--q-shadow); }
  .ayah-card:hover { border-color: var(--q-gold); box-shadow: 0 15px 35px rgba(184, 134, 11, 0.15); }
  .ayah-arabic { font-size: var(--q-arabic-size); line-height: 2.4; direction: rtl; margin-bottom: 30px; word-wrap: break-word; color: var(--q-text-arabic); font-weight: 700; }
  @media (max-width: 768px) { .ayah-arabic { line-height: 2.2; padding: 10px 0; } .ayah-card{ padding: 25px 20px; } }
  @media (max-width: 380px) { .bismillah { font-size: 2.5rem !important; } .navbar-brand { font-size: 0.9rem; } }
  .ayah-latin { color: var(--q-text-latin); font-size: 1.2rem; font-weight: 700; font-style: italic; margin-bottom: 15px; letter-spacing: 0.5px; }
  .ayah-translate { color: var(--q-text-muted); line-height: 1.8; font-size: 1.05rem; font-weight: 500; }
  .btn-circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--q-bg-body); border: 2px solid var(--q-border); color: var(--q-text-main); transition: 0.2s; font-size: 1.1rem; }
  .btn-circle:hover, .btn-circle.active { background: var(--q-gold); color: #fff; border-color: var(--q-gold); box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3); }
  .btn-circle.sm { width: 38px; height: 38px; font-size: 0.9rem; }
  .audio-pill { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 600px; z-index: 1050; background: var(--q-glass-bg); backdrop-filter: blur(25px); border: 3px solid var(--q-gold); border-radius: 2rem; padding: 15px 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  .audio-pill.show { bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
  .audio-pill audio { width: 100%; height: 40px; outline: none; }
  .toast-container { z-index: 1100; }
  .custom-toast { background: var(--q-primary); color: white; border: 2px solid var(--q-gold); box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-radius: 1rem; }
  #btn-back-to-top { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); right: 30px; display: none; z-index: 1040; background: var(--q-primary); color: white; border: 3px solid rgba(255,255,255,0.2); border-radius: 50%; width: 55px; height: 55px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
  #btn-back-to-top:hover { background: var(--q-gold); transform: translateY(-5px); }
  .premium-footer { border-top: 2px solid var(--q-border); padding: 40px 20px; text-align: center; background: var(--q-bg-card); margin-top: auto; position: relative; z-index: 10; }
  .premium-footer p { margin: 0; color: var(--q-text-muted); font-size: 1rem; font-weight: 500; }
  .premium-footer a { color: var(--q-primary); text-decoration: none; font-weight: 700; transition: 0.2s; }
  .premium-footer a:hover { color: var(--q-gold); }
  .fade-in { animation: fadeIn 0.5s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .nav-surah-btn { border-radius: 1.2rem; border: 2px solid var(--q-border); background: var(--q-bg-card); padding: 18px 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: var(--q-text-main); text-decoration: none; }
  .nav-surah-btn:hover { border-color: var(--q-gold); transform: translateY(-3px); box-shadow: 0 10px 25px var(--q-shadow); color: var(--q-text-main); }
  .font-size-control { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body data-bs-theme="light">

  <nav class="navbar fixed-top navbar-glass">
    <div class="container position-relative d-flex justify-content-between align-items-center">
      <div class="d-md-none" style="width: 48px;"></div>
      <div class="brand-wrapper">
          <a class="navbar-brand m-0 d-flex align-items-center gap-2" href="javascript:void(0)" onclick="resetView()">
            <i class="fas fa-quran" style="color: var(--q-gold); font-size: 1.2rem;"></i> AL-QURAN DIGITAL
          </a>
      </div>
      <button aria-label="Toggle Dark Mode" class="btn btn-circle shadow-sm" id="theme-toggle">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </nav>

  <div id="dashboard-section">
      <section class="prayer-section">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <h5 class="fw-bold m-0" style="color: var(--q-primary);"><i class="fas fa-clock me-2" style="color: var(--q-gold);"></i> Jadwal Waktu Sholat</h5>
                <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded-pill" id="location-text" onclick="changeCity()" style="cursor: pointer;" title="Klik untuk ubah kota manual">
                    <i class="fas fa-spinner fa-spin"></i> Mendeteksi...
                </span>
            </div>
            <div class="row g-3 mb-4" id="prayer-grid"></div>
            <div class="alert align-items-center justify-content-between p-3 fade-in" id="last-read-banner" onclick="resumeLastRead()" role="alert">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; background: rgba(184, 134, 11, 0.15); color: var(--q-gold);">
                        <i class="fas fa-book-open fs-5"></i>
                    </div>
                    <div>
                        <small class="text-muted fw-bold text-uppercase" style="letter-spacing: 1px;">Lanjutkan Membaca</small>
                        <h6 class="m-0 fw-bold fs-5" id="last-read-text" style="color: var(--q-text-main);">Surat - Ayat -</h6>
                    </div>
                </div>
                <i class="fas fa-chevron-right fs-4" style="color: var(--q-gold);"></i>
            </div>
        </div>
      </section>

      <section class="hero-section">
          <div class="container">
              <div class="search-input-wrapper">
                  <input id="search-input" placeholder="Cari surat... (Misal: baqarah, yasin)" type="text"/>
              </div>
              <div class="quick-links-scroll" id="chips-container"></div>
          </div>
      </section>

      <section class="grid-section">
          <div class="container">
              <div class="row g-4" id="surah-grid"></div>
          </div>
      </section>
  </div>

  <div id="ayah-section">
      <div class="container" style="max-width: 950px;">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-5 border-bottom pb-4">
              <button aria-label="Kembali ke Beranda" class="btn rounded-pill border shadow-sm fw-bold px-4 py-2" onclick="resetView()" style="background: var(--q-bg-card); color: var(--q-text-main); border: 2px solid var(--q-border) !important;">
                  <i class="fas fa-arrow-left me-2" style="color: var(--q-gold);"></i> Kembali
              </button>
              <div class="font-size-control">
                  <span class="text-muted small fw-bold d-none d-sm-inline">Ukuran Ayat</span>
                  <button aria-label="Perkecil font" class="btn-circle sm shadow-sm" onclick="changeFontSize(-1)"><i class="fas fa-minus"></i></button>
                  <button aria-label="Perbesar font" class="btn-circle sm shadow-sm" onclick="changeFontSize(1)"><i class="fas fa-plus"></i></button>
              </div>
              <div class="text-end">
                  <h3 class="fw-bold mb-1" id="surah-title-id" style="color: var(--q-primary);">Memuat...</h3>
                  <span class="badge bg-secondary bg-opacity-10 text-secondary border px-3 py-1 rounded-pill" id="surah-desc">-</span>
              </div>
          </div>
          <div id="ayah-content"></div>
          <div class="row g-3 mt-2" id="surah-pager"></div>
      </div>
  </div>

  <div class="audio-pill" id="audio-container">
    <div class="d-flex justify-content-between align-items-center mb-3 px-2">
      <span class="fw-bold" id="audio-info" style="color: var(--q-text-main); font-size: 1.1rem;">Memutar: -</span>
      <button aria-label="Tutup Audio" class="btn btn-danger rounded-circle d-flex align-items-center justify-content-center shadow" onclick="closeAudio()" style="width: 35px; height: 35px; border:none;">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <audio class="w-100" controls="controls" id="global-audio"></audio>
  </div>

  <button aria-label="Kembali ke atas" id="btn-back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
      <i class="fas fa-arrow-up"></i>
  </button>

  <div class="toast-container position-fixed bottom-0 end-0 p-3 mb-5">
    <div aria-atomic="true" aria-live="assertive" class="toast custom-toast" id="appToast" role="alert">
      <div class="d-flex">
        <div class="toast-body fw-bold fs-6 d-flex align-items-center gap-2" id="toastMessage">
          <i class="fas fa-check-circle"></i> Disimpan ke Bookmark!
        </div>
        <button aria-label="Tutup Notifikasi" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" type="button"></button>
      </div>
    </div>
  </div>

  <div aria-hidden="true" aria-labelledby="cityModalLabel" class="modal fade" id="cityModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: var(--q-bg-card); border: 2px solid var(--q-border); border-radius: 1.2rem;">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold" id="cityModalLabel" style="color: var(--q-primary);">
            <i class="fas fa-map-marker-alt me-2" style="color: var(--q-gold);"></i> Ubah Lokasi
          </h5>
          <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Masukkan nama kota Anda untuk menyesuaikan jadwal sholat.</p>
          <input class="form-control form-control-lg" id="cityInput" placeholder="Contoh: Jakarta, Surabaya, Jambi" style="border-radius: 10px; border: 2px solid var(--q-border); background: var(--q-bg-body); color: var(--q-text-main);" type="text"/>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button class="btn fw-bold px-4" data-bs-dismiss="modal" style="color: var(--q-text-muted);" type="button">Batal</button>
          <button class="btn fw-bold px-4" onclick="submitCity()" style="background: var(--q-primary); color: white; border-radius: 10px;" type="button">Cari Lokasi</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="premium-footer">
    <p>&#169; 2026 Design oleh <a href="https://www.yefriharyanto.id" rel="noopener" target="_blank">Yefri Haryanto</a>. Hak Cipta Dilindungi.</p>
  </footer>

  <script crossorigin="anonymous" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
      const dashboardSec = document.getElementById('dashboard-section');
      const ayahSec = document.getElementById('ayah-section');
      const surahGrid = document.getElementById('surah-grid');
      const searchInput = document.getElementById('search-input');
      const chipsContainer = document.getElementById('chips-container');
      const ayahContent = document.getElementById('ayah-content');
      const surahPager = document.getElementById('surah-pager');
      const btnBackToTop = document.getElementById('btn-back-to-top');
      const lastReadBanner = document.getElementById('last-read-banner');

      const globalAudio = document.getElementById('global-audio');
      const audioContainer = document.getElementById('audio-container');
      const audioInfo = document.getElementById('audio-info');

      let surahsData = [];
      let currentAyahs = [];
      let currentPlayingIndex = -1;
      let currentSurahNameGlobal = "";
      let currentSurahNomor = null;
      let isResumingGlobal = false;

      // KONTROL UKURAN FONT AYAT
      const FONT_MIN = 2.0, FONT_MAX = 5.0;
      function applyFontSize(size) {
          document.documentElement.style.setProperty('--q-arabic-size', size + 'rem');
          localStorage.setItem('quran-arabic-size', size);
      }
      window.changeFontSize = function(delta) {
          let current = parseFloat(localStorage.getItem('quran-arabic-size') || '3.5');
          current = Math.min(FONT_MAX, Math.max(FONT_MIN, current + delta * 0.3));
          applyFontSize(current);
      };
      applyFontSize(parseFloat(localStorage.getItem('quran-arabic-size') || '3.5'));

      // UNLOCK AUDIO MOBILE
      document.body.addEventListener('click', () => {
          if (globalAudio.paused && !globalAudio.src) {
              globalAudio.play().then(() => globalAudio.pause()).catch(() => {});
          }
      }, { once: true });

      // THEME ENGINE
      const themeToggle = document.getElementById('theme-toggle');
      const htmlEl = document.documentElement;
      const setTheme = (theme) => {
          htmlEl.setAttribute('data-bs-theme', theme);
          localStorage.setItem('quran-theme', theme);
          themeToggle.innerHTML = theme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun" style="color: var(--q-gold);"></i>';
      };
      setTheme(localStorage.getItem('quran-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      themeToggle.addEventListener('click', () => setTheme(htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'));

      // TOAST
      window.showToast = function(msg) {
          document.getElementById('toastMessage').innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
          const toastEl = new bootstrap.Toast(document.getElementById('appToast'), { delay: 3000 });
          toastEl.show();
      };

      window.onscroll = function () {
          btnBackToTop.style.display = (document.body.scrollTop > 400 || document.documentElement.scrollTop > 400) ? "block" : "none";
      };

      // ROUTING
      const handleRouting = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#surah-')) {
              const nomor = hash.replace('#surah-', '');
              doLoadSurahDetail(nomor);
          } else {
              doShowDashboard();
          }
      };
      window.addEventListener('popstate', handleRouting);
      window.addEventListener('hashchange', handleRouting);

      function doShowDashboard() {
          ayahSec.style.display = 'none';
          dashboardSec.style.display = 'block';
          window.scrollTo(0, 0);
          closeAudio();
      }

      window.loadSurahDetail = (nomor) => { window.location.hash = `#surah-${nomor}`; };
      window.resetView = () => { history.pushState("", document.title, window.location.pathname); doShowDashboard(); };

      // --- AUDIO LOGIC ---
      window.playAudio = function(ayahNumber, audioUrl, index) {
          if (!audioUrl) return showToast("Audio tidak tersedia.");
          const secureUrl = audioUrl.replace('http://', 'https://');
          audioContainer.classList.add('show');
          audioInfo.innerText = `${currentSurahNameGlobal} : Ayat ${ayahNumber}`;

          if (globalAudio.src !== secureUrl) {
              globalAudio.src = secureUrl;
              globalAudio.load();
          }
          globalAudio.currentTime = 0;
          const playPromise = globalAudio.play();
          if (playPromise !== undefined) {
              playPromise.catch(e => console.error("Autoplay Blocked:", e));
          }
          currentPlayingIndex = index;

          document.querySelectorAll('.ayah-card').forEach(el => {
              el.style.borderColor = 'var(--q-border)';
              el.style.boxShadow = '0 5px 20px var(--q-shadow)';
          });
          const currentCard = document.getElementById(`ayah-${ayahNumber}`);
          if (currentCard) {
              currentCard.style.borderColor = 'var(--q-gold)';
              currentCard.style.boxShadow = '0 0 30px rgba(184, 134, 11, 0.25)';
              currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
      };

      globalAudio.addEventListener('ended', () => {
          if (ayahSec.style.display === 'none') return closeAudio();
          if (currentPlayingIndex >= 0 && currentPlayingIndex < currentAyahs.length - 1) {
              const nextAyah = currentAyahs[currentPlayingIndex + 1];
              const nextUrl = nextAyah.audio['05'];
              if (nextUrl) window.playAudio(nextAyah.nomorAyat, nextUrl, currentPlayingIndex + 1);
          } else {
              audioInfo.innerText = 'Selesai memutar surat.';
              currentPlayingIndex = -1;
              document.querySelectorAll('.ayah-card').forEach(el => {
                  el.style.borderColor = 'var(--q-border)';
                  el.style.boxShadow = '0 5px 20px var(--q-shadow)';
              });
          }
      });

      window.closeAudio = () => {
          globalAudio.pause();
          globalAudio.removeAttribute('src');
          globalAudio.load();
          audioContainer.classList.remove('show');
          document.querySelectorAll('.ayah-card').forEach(el => {
              el.style.borderColor = 'var(--q-border)';
              el.style.boxShadow = '0 5px 20px var(--q-shadow)';
          });
      };

      // BAGIKAN / SALIN AYAT
      window.shareAyah = function(surahName, surahNomor, ayahNumber, arabText, translation) {
          const text = `${arabText}\n\n"${translation}"\n\n(QS. ${surahName}: ${ayahNumber})`;
          if (navigator.share) {
              navigator.share({ title: `QS. ${surahName}: ${ayahNumber}`, text }).catch(() => {});
          } else if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(() => showToast("Ayat disalin ke clipboard!")).catch(() => showToast("Gagal menyalin ayat."));
          } else {
              showToast("Perangkat tidak mendukung fitur ini.");
          }
      };

      // JADWAL SHOLAT
      const getTodayString = () => new Date().toISOString().split('T')[0];

      function initPrayerTimes(forceRefresh = false) {
          const cachedLoc = localStorage.getItem('quran-loc-name');
          const cachedTimings = localStorage.getItem('quran-timings-cache');
          const cachedDate = localStorage.getItem('quran-timings-date');

          if (!forceRefresh && cachedLoc && cachedTimings && cachedDate === getTodayString()) {
              renderPrayerTimes(JSON.parse(cachedTimings), cachedLoc);
              return;
          }
          if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                  pos => fetchPrayerTimes(pos.coords.latitude, pos.coords.longitude),
                  err => {
                      if (err.code === 1) showToast("Izin lokasi ditolak. Menampilkan jadwal default.");
                      fetchPrayerTimesCity('Jakarta', 'Indonesia');
                  },
                  { timeout: 10000 }
              );
          } else {
              fetchPrayerTimesCity('Jakarta', 'Indonesia');
          }
      }

      async function fetchPrayerTimes(lat, lon) {
          try {
              let locName = "Lokasi Anda";
              try {
                  const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&email=admin@yefriharyanto.id`);
                  const geoData = await geoRes.json();
                  locName = geoData.address.city || geoData.address.town || geoData.address.county || "Lokasi Anda";
              } catch (e) {}

              const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=11`);
              const data = await res.json();

              localStorage.setItem('quran-loc-name', locName);
              localStorage.setItem('quran-timings-cache', JSON.stringify(data.data.timings));
              localStorage.setItem('quran-timings-date', getTodayString());
              renderPrayerTimes(data.data.timings, locName);
          } catch (e) { fetchPrayerTimesCity('Jakarta', 'Indonesia'); }
      }

      function fetchPrayerTimesCity(city, country = 'Indonesia') {
          document.getElementById('location-text').innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mencari...`;
          fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=11`)
              .then(res => res.json())
              .then(data => {
                  if (data.code === 200) {
                      localStorage.setItem('quran-loc-name', city);
                      localStorage.setItem('quran-timings-cache', JSON.stringify(data.data.timings));
                      localStorage.setItem('quran-timings-date', getTodayString());
                      renderPrayerTimes(data.data.timings, city);
                  } else {
                      showToast("Kota tidak ditemukan.");
                      renderPrayerTimes(null, "Gagal");
                  }
              })
              .catch(err => renderPrayerTimes(null, ""));
      }

      let cityModalInstance;
      window.changeCity = function() {
          if (!cityModalInstance) cityModalInstance = new bootstrap.Modal(document.getElementById('cityModal'));
          document.getElementById('cityInput').value = '';
          cityModalInstance.show();
      };
      window.submitCity = function() {
          const city = document.getElementById('cityInput').value;
          if (city && city.trim() !== "") {
              cityModalInstance.hide();
              fetchPrayerTimesCity(city.trim());
          } else {
              showToast("Nama kota tidak boleh kosong!");
          }
      };

      function renderPrayerTimes(timings, locName) {
          if (!timings) {
              document.getElementById('location-text').innerHTML = `<i class="fas fa-exclamation-triangle"></i> Gagal`;
              document.getElementById('prayer-grid').innerHTML = `<div class="col-12 text-center text-muted"><small>Jadwal tidak tersedia saat ini.</small></div>`;
              return;
          }
          document.getElementById('location-text').innerHTML = `<i class="fas fa-map-marker-alt me-1"></i> ${locName}`;
          const now = new Date();
          const currTime = now.getHours() * 60 + now.getMinutes();
          const times = [
              { id: 'Imsak', t: timings.Imsak }, { id: 'Subuh', t: timings.Fajr },
              { id: 'Dzuhur', t: timings.Dhuhr }, { id: 'Ashar', t: timings.Asr },
              { id: 'Maghrib', t: timings.Maghrib }, { id: 'Isya', t: timings.Isha }
          ];
          let nextP = times.find(p => {
              const [h, m] = p.t.split(':');
              return (parseInt(h) * 60 + parseInt(m)) > currTime;
          }) || times[1];

          document.getElementById('prayer-grid').innerHTML = times.map(p => `
              <div class="col-6 col-md-4 col-lg-2 fade-in">
                  <div class="prayer-card ${p.id === nextP.id ? 'active-prayer' : ''}">
                      <span class="prayer-name">${p.id}</span>
                      <div class="prayer-time">${p.t}</div>
                  </div>
              </div>
          `).join('');
      }

      function generateSkeleton(count) {
          return Array(count).fill(`
              <div class="col-12 col-md-6 col-lg-4"><div class="skeleton-card"><div class="skeleton-ring"></div><div class="skeleton-text"><div class="skeleton-line w-75"></div><div class="skeleton-line w-50"></div></div></div></div>
          `).join('');
      }

      window.fetchSurahs = function() {
          const cachedSurahs = localStorage.getItem('quran-surahs-cache');
          if (cachedSurahs) {
              surahsData = JSON.parse(cachedSurahs);
              renderSurahGrid(surahsData);
              renderChips(surahsData);
          } else {
              surahGrid.innerHTML = generateSkeleton(9);
          }
          fetch('https://equran.id/api/v2/surat')
              .then(res => res.json())
              .then(data => {
                  if (data.code === 200) {
                      surahsData = data.data;
                      localStorage.setItem('quran-surahs-cache', JSON.stringify(surahsData));
                      if (!cachedSurahs) {
                          renderSurahGrid(surahsData);
                          renderChips(surahsData);
                      }
                  }
              }).catch(err => {
                  if (!cachedSurahs) {
                      surahGrid.innerHTML = `<div class="col-12 text-center py-5"><i class="fas fa-wifi fa-3x mb-3 text-muted"></i><h5 class="fw-bold">Mode Offline</h5><p class="text-muted">Koneksi terputus dan tidak ada data tersimpan.</p></div>`;
                  }
              });
      };

      function renderChips(surahs) {
          chipsContainer.innerHTML = surahs.map(s => `<div class="quick-chip shadow-sm" onclick="loadSurahDetail(${s.nomor})">${s.nomor}. ${s.namaLatin}</div>`).join('');
      }

      function renderSurahGrid(surahs) {
          if (surahs.length === 0) {
              surahGrid.innerHTML = `<div class="col-12 text-center text-muted py-5 fw-bold fs-5">Surat tidak ditemukan.</div>`;
              return;
          }
          surahGrid.innerHTML = surahs.map(s => `
              <div class="col-12 col-md-6 col-lg-4 fade-in">
                  <div class="surah-card" onclick="loadSurahDetail(${s.nomor})">
                      <div class="surah-num-ring">${s.nomor}</div>
                      <div class="ms-4 flex-grow-1">
                          <div class="fw-bold fs-5" style="color: var(--q-text-main);">${s.namaLatin}</div>
                          <div class="text-muted fw-semibold mt-1" style="font-size: 0.85rem;">${s.arti} • ${s.jumlahAyat} Ayat</div>
                      </div>
                      <div class="font-arabic surah-arabic-name">${s.nama}</div>
                  </div>
              </div>
          `).join('');
      }

      function debounce(func, wait) {
          let timeout;
          return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); };
      }
      searchInput.addEventListener('input', debounce((e) => {
          const key = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
          renderSurahGrid(surahsData.filter(s => {
              const namaClean = s.namaLatin.toLowerCase().replace(/[^a-z0-9]/g, '');
              const artiClean = s.arti.toLowerCase().replace(/[^a-z0-9]/g, '');
              return namaClean.includes(key) || artiClean.includes(key);
          }));
      }, 300));

      function updateLastReadUI() {
          const lastReadData = JSON.parse(localStorage.getItem('quran-last-read'));
          if (lastReadData) {
              document.getElementById('last-read-text').innerText = `Surat ${lastReadData.name} : Ayat ${lastReadData.ayah}`;
              lastReadBanner.style.display = 'flex';
          }
      }
      updateLastReadUI();

      window.resumeLastRead = function() {
          const data = JSON.parse(localStorage.getItem('quran-last-read'));
          if (data) {
              isResumingGlobal = true;
              window.location.hash = `#surah-${data.surah}`;
          }
      };

      const ayahObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
              if (entry.isIntersecting) {
                  const sNum = entry.target.getAttribute('data-surah');
                  const aNum = entry.target.getAttribute('data-ayah');
                  localStorage.setItem('quran-last-read', JSON.stringify({ surah: sNum, ayah: aNum, name: currentSurahNameGlobal }));
                  updateLastReadUI();
              }
          });
      }, { threshold: 0.2 });

      // NAVIGASI SURAT SEBELUM / SESUDAH
      function renderSurahPager(nomor) {
          const n = parseInt(nomor);
          const prev = n > 1 ? surahsData.find(s => s.nomor === n - 1) : null;
          const next = n < 114 ? surahsData.find(s => s.nomor === n + 1) : null;
          let html = '';
          if (prev) {
              html += `<div class="col-6"><a class="nav-surah-btn w-100" href="javascript:void(0)" onclick="loadSurahDetail(${prev.nomor})">
                  <i class="fas fa-arrow-left" style="color: var(--q-gold);"></i>
                  <div><small class="text-muted d-block">Sebelumnya</small><span class="fw-bold">${prev.namaLatin}</span></div>
              </a></div>`;
          } else { html += `<div class="col-6"></div>`; }
          if (next) {
              html += `<div class="col-6"><a class="nav-surah-btn w-100 justify-content-end text-end" href="javascript:void(0)" onclick="loadSurahDetail(${next.nomor})">
                  <div><small class="text-muted d-block">Selanjutnya</small><span class="fw-bold">${next.namaLatin}</span></div>
                  <i class="fas fa-arrow-right" style="color: var(--q-gold);"></i>
              </a></div>`;
          } else { html += `<div class="col-6"></div>`; }
          surahPager.innerHTML = html;
      }

      function doLoadSurahDetail(nomor) {
          dashboardSec.style.display = 'none';
          ayahSec.style.display = 'block';
          window.scrollTo(0, 0);
          currentSurahNomor = nomor;

          document.getElementById('surah-title-id').innerText = "Memuat...";
          document.getElementById('surah-desc').innerText = "Mohon tunggu sebentar";
          surahPager.innerHTML = '';
          ayahContent.innerHTML = `<div class="text-center py-5"><div class="spinner-border" style="color: var(--q-gold); width: 4rem; height: 4rem;"></div></div>`;

          fetch(`https://equran.id/api/v2/surat/${nomor}`)
              .then(res => res.json())
              .then(res => {
                  if (res.code === 200) {
                      const surah = res.data;
                      currentAyahs = surah.ayat;
                      currentSurahNameGlobal = surah.namaLatin;

                      document.getElementById('surah-title-id').innerText = surah.namaLatin;
                      document.getElementById('surah-desc').innerText = `${surah.arti} • ${surah.tempatTurun} • ${surah.jumlahAyat} Ayat`;

                      let html = (surah.nomor !== 1 && surah.nomor !== 9) ? `<div class="bismillah font-arabic fade-in">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>` : '';
                      const savedBookmark = JSON.parse(localStorage.getItem('quran-bookmark')) || {};

                      surah.ayat.forEach((ayat, index) => {
                          const isBookmarked = (savedBookmark.surah === surah.nomor && savedBookmark.ayah === ayat.nomorAyat);
                          const btnClass = isBookmarked ? 'btn-circle active' : 'btn-circle';
                          const iconClass = isBookmarked ? 'fas fa-bookmark' : 'far fa-bookmark';
                          const audioUrl = ayat.audio['05'];
                          const safeArab = ayat.teksArab.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                          const safeTranslate = ayat.teksIndonesia.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                          html += `
                              <div class="ayah-card fade-in" id="ayah-${ayat.nomorAyat}" data-surah="${surah.nomor}" data-ayah="${ayat.nomorAyat}">
                                  <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom">
                                      <span class="badge rounded-pill fw-bold" style="font-size:16px; padding:10px 20px; background: rgba(184, 134, 11, 0.15); color: var(--q-gold); border: 2px solid var(--q-gold);">
                                        ${surah.nomor} : ${ayat.nomorAyat}
                                      </span>
                                      <div class="d-flex gap-3">
                                          <button aria-label="Bagikan Ayat" class="btn-circle shadow-sm" onclick="shareAyah('${surah.namaLatin}', ${surah.nomor}, ${ayat.nomorAyat}, '${safeArab}', '${safeTranslate}')">
                                              <i class="fas fa-share-alt"></i>
                                          </button>
                                          <button aria-label="Putar Audio" class="btn-circle shadow-sm" onclick="playAudio(${ayat.nomorAyat}, '${audioUrl}', ${index})">
                                              <i class="fas fa-play"></i>
                                          </button>
                                          <button aria-label="Tandai Bookmark" class="${btnClass} shadow-sm" onclick="toggleBookmark(this, ${surah.nomor}, ${ayat.nomorAyat})">
                                              <i class="${iconClass}"></i>
                                          </button>
                                      </div>
                                  </div>
                                  <div class="ayah-arabic font-arabic">${ayat.teksArab}</div>
                                  <div class="ayah-latin">${ayat.teksLatin}</div>
                                  <div class="ayah-translate">${ayat.teksIndonesia}</div>
                              </div>
                          `;
                      });

                      ayahContent.innerHTML = html;
                      document.querySelectorAll('.ayah-card').forEach(card => ayahObserver.observe(card));
                      renderSurahPager(surah.nomor);

                      let scrollTarget = null;
                      if (isResumingGlobal) {
                          const lastData = JSON.parse(localStorage.getItem('quran-last-read'));
                          if (lastData && lastData.surah == surah.nomor) scrollTarget = lastData.ayah;
                          isResumingGlobal = false;
                      } else if (savedBookmark.surah === surah.nomor) {
                          scrollTarget = savedBookmark.ayah;
                      }
                      if (scrollTarget) {
                          setTimeout(() => {
                              const targetEl = document.getElementById(`ayah-${scrollTarget}`);
                              if (targetEl) {
                                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                  targetEl.style.borderColor = 'var(--q-gold)';
                                  targetEl.style.boxShadow = '0 0 30px rgba(184, 134, 11, 0.25)';
                              }
                          }, 500);
                      }
                  }
              })
              .catch(err => {
                  ayahContent.innerHTML = `
                      <div class="text-center py-5">
                          <i class="fas fa-wifi fa-3x mb-3" style="color: var(--q-primary);"></i>
                          <h5 class="fw-bold">Gagal memuat Surat</h5>
                          <button class="btn btn-outline-success mt-3" onclick="doLoadSurahDetail(${nomor})">Coba Lagi</button>
                      </div>
                  `;
              });
      }

      window.toggleBookmark = function(btn, surah, ayah) {
          const icon = btn.querySelector('i');
          const bookmarkKey = 'quran-bookmark';
          if (btn.classList.contains('active')) {
              btn.classList.remove('active'); icon.classList.replace('fas', 'far');
              localStorage.removeItem(bookmarkKey);
              showToast("Bookmark dihapus.");
          } else {
              document.querySelectorAll('.btn-circle i.fa-bookmark').forEach(i => { i.classList.replace('fas', 'far'); i.parentElement.classList.remove('active'); });
              btn.classList.add('active'); icon.classList.replace('far', 'fas');
              localStorage.setItem(bookmarkKey, JSON.stringify({ surah: surah, ayah: ayah }));
              showToast(`Ayat ${ayah} tersimpan di Bookmark!`);
          }
      };

      initPrayerTimes();
      handleRouting();
      fetchSurahs();
  });
  </script>
</body>
</html>
